[pytest]

# =============================================================================
# Test Discovery
# =============================================================================

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

# =============================================================================
# Default Options
# =============================================================================

addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --import-mode=importlib

# =============================================================================
# Console Output
# =============================================================================

console_output_style = progress

# =============================================================================
# Custom Markers
# =============================================================================

markers =
    # Test Types
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    performance: Performance tests
    security: Security tests

    # Backend Modules
    common: Common framework
    config: Configuration framework
    di: Dependency Injection
    providers: Provider framework
    storage: Storage layer
    rag: RAG engine
    agents: Agent framework
    api: API layer
    auth: Authentication & Authorization

    # Execution
    slow: Long-running tests
    external: Requires external services
    smoke: Smoke tests
    regression: Regression tests

# =============================================================================
# Warning Configuration
# =============================================================================

filterwarnings =
    error

    ignore::DeprecationWarning

    ignore:`huggingface_hub` cache-system uses symlinks.*:UserWarning

# =============================================================================
# Logging
# =============================================================================

log_cli = true
log_cli_level = INFO