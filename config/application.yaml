###############################################################################
# RAGOps Enterprise Configuration
###############################################################################

application_name: "RAGOps Platform"
version: "1.0.0"

environment: development

paths:
  root_dir: .
  data_dir: data
  logs_dir: logs
  temp_dir: temp

features:
  rag: true
  plugins: true
  telemetry: true
  caching: true
  authentication: true
  authorization: true

health:
  enabled: true
  timeout_seconds: 10

logging:
  level: INFO
  service_name: ragops
  correlation_id_header: X-Correlation-ID
  request_id_header: X-Request-ID

  console:
    enabled: true
    json_output: false
    colored: true

  file:
    enabled: true
    directory: logs
    filename: ragops.log
    json_output: true
    rotation:
      enabled: true
      max_file_size_mb: 100
      backup_count: 10
      compress: true

  audit:
    enabled: true
    filename: audit.log

authentication:
  enabled: false
  jwt:
    algorithm: HS256
    access_token_expiry_minutes: 60
    refresh_token_expiry_days: 30
  api_key:
    enabled: false
    header_name: X-API-Key
  cookies:
    secure: false
    http_only: true
    same_site: lax

authorization:
  enabled: true
  rbac: true
  default_role: user

cors:
  enabled: true
  allow_origins:
    - "*"
  allow_methods:
    - "*"
  allow_headers:
    - "*"
  allow_credentials: true

encryption:
  enabled: false
  algorithm: AES-256-GCM

llm:
  enabled: true
  provider: openai
  model: gpt-4.1
  timeout_seconds: 60
  temperature: 0.0
  max_tokens: 4096
  retry:
    max_attempts: 3
    initial_delay_seconds: 1.0
    max_delay_seconds: 30.0
    exponential_backoff: true

embeddings:
  enabled: true
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536
  timeout_seconds: 120
  retry:
    max_attempts: 3
    initial_delay_seconds: 1.0
    max_delay_seconds: 30.0
    exponential_backoff: true

vector_store:
  enabled: true
  provider: pinecone
  index_name: ragops-edmira
  namespace: edmira_hr
  timeout_seconds: 60
  retry:
    max_attempts: 3
    initial_delay_seconds: 1.0
    max_delay_seconds: 30.0
    exponential_backoff: true

storage_root: storage

storage:
  enabled: true
  provider: local
  timeout_seconds: 60
  retry:
    max_attempts: 3
    initial_delay_seconds: 1.0
    max_delay_seconds: 30.0
    exponential_backoff: true

ocr:
  enabled: false
  provider: tesseract
  language: en
  timeout_seconds: 60
  retry:
    max_attempts: 3
    initial_delay_seconds: 1.0
    max_delay_seconds: 30.0
    exponential_backoff: true

speech: null
reranker: null

###############################################################################
# Domain hierarchy
#
# Domain relationships are configuration-driven.
#
# Level 1: Business domain
# Level 2: Functional sub-domain
# Level 3: Optional specialized category
#
# Knowledge Bases will later belong to exactly one domain node.
###############################################################################

domains:
  hr:
    name: "HR"
    description: >
      Human Resources covering employee management, payroll,
      benefits and workplace policies.
    enabled: true

  employee_policies:
    name: "Employee Policies"
    description: >
      Employee HR policies including leave, attendance,
      benefits and workplace procedures.
    parent_id: hr
    enabled: true

  payroll:
    name: "Payroll"
    description: >
      Payroll policies covering salary, payroll processing,
      deductions and employee tax information.
    parent_id: hr
    enabled: true

  payroll_tax:
    name: "Payroll Tax"
    description: >
      Detailed payroll tax policies, deductions and tax
      compliance requirements.
    parent_id: payroll
    enabled: true

  finance:
    name: "Finance"
    description: >
      Finance covering expenses, reimbursements,
      financial approvals and financial controls.
    enabled: true

  finance_policies:
    name: "Finance Policies"
    description: >
      Finance policies covering expenses, reimbursements,
      financial approvals and financial controls.
    parent_id: finance
    enabled: true

  customer_service:
    name: "Customer Service"
    description: >
      Customer-related processes, agreements, support
      and customer operations.
    enabled: false

  technical:
    name: "Technical"
    description: >
      Technical documentation covering systems,
      architecture, configuration and troubleshooting.
    enabled: false